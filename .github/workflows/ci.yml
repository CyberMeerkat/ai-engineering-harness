name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A version pin goes stale because upstream published, not because this repo
    # changed — so the drift check needs a trigger that fires without a commit.
    - cron: '0 6 * * 1'

jobs:
  # ── 1. shellcheck all .sh files ─────────────────────────────────────────────
  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' | sort | while IFS= read -r f; do
            echo "checking $f"
            shellcheck --severity=warning "$f"
          done

  # ── 2. PSScriptAnalyzer on setup.ps1 ────────────────────────────────────────
  lint-powershell:
    name: Lint PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path setup.ps1 -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors"

  # ── 3. validate all JSON files ──────────────────────────────────────────────
  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' | sort | while IFS= read -r f; do
            echo "checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

  # ── 4. dry-run matrix (ubuntu / macos / windows) ────────────────────────────
  dry-run-matrix:
    name: Dry-run setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Read required Node major
        id: node-version
        shell: python3 {0}
        run: |
          import json, os
          with open('versions.json') as f:
              v = json.load(f)
          major = str(v['node']['major'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'major={major}\n')

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.major }}

      - name: Dry-run setup (bash)
        if: runner.os != 'Windows'
        run: bash setup.sh --dry-run

      - name: Dry-run setup (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 -DryRun

      - name: Doctor (bash)
        if: runner.os != 'Windows'
        run: bash setup.sh --doctor

      - name: Doctor (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 -Doctor

  # ── 5. local security plugins: syntax + functional smoke test ──────────────
  test-plugins:
    name: Test local security plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check all local plugin files
        run: |
          for f in harness/plugins/local/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Functional smoke test
        run: node .github/scripts/test-local-plugins.mjs

  # ── 6. installer core: syntax-check every module ────────────────────────────
  test-installer-core:
    name: Syntax-check installer core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check setup.mjs and every lib module
        run: |
          node --check harness/scripts/setup.mjs
          for f in harness/scripts/lib/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done
          for f in harness/scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

  # ── 7. structural invariants ────────────────────────────────────────────────
  # Catches the class of drift where two files that must agree quietly stop
  # agreeing — a rule not listed in its README, a skill with no SKILL.md, a
  # manifest pointing at a renamed directory. None of these break a dry-run, so
  # without this job they ship green.
  test-structural:
    name: Structural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert structural invariants
        run: node .github/scripts/test-structural.mjs

  # ── 8. dependency policy ────────────────────────────────────────────────────
  # This harness installs plugins that run with filesystem and shell access in
  # every project the user opens, so a dependency here reaches further than in an
  # ordinary app. The policy is zero-by-default; this job makes that a gate rather
  # than an accident of nobody having added one yet.
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce dependency policy
        run: node harness/scripts/check-deps.mjs

      - name: npm audit
        # There are no dependencies and therefore no lockfile, and `npm audit`
        # cannot run without one. The audit becomes a real gate the moment a
        # dependency appears; until then the policy job above provides the cover.
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=moderate
          else
            echo "No package-lock.json — nothing to audit. Dependency policy is enforced separately."
          fi

  # ── 9. version pin drift (advisory) ─────────────────────────────────────────
  # Reports when a pin in versions.json has fallen behind what npm publishes.
  # Advisory by default: being behind is a recommendation, and a job that fails
  # the build for a recommendation is one people learn to ignore. It DOES fail on
  # a pin that references an unpublished version, because that breaks fresh
  # installs outright.
  #
  # Scheduled as well as on push: a pin goes stale because upstream released, not
  # because this repo changed, so a push-only trigger would never notice.
  version-drift:
    name: Version pin drift (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version pins against the npm registry
        run: node harness/scripts/check-versions.mjs
